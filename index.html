<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>My Simple To-Do List</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; background: #f9f9f9; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; cursor: pointer; }
        .completed { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>

    <h2>To-Do List ของฉัน</h2>
    <input type="text" id="taskInput" placeholder="เพิ่มงานใหม่...">
    <button onclick="addTask()">เพิ่ม</button>
    <ul id="taskList"></ul>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            if (taskText === '') return;

            const li = document.createElement('li');
            li.textContent = taskText;
            
            // คลิกที่รายการเพื่อสลับสถานะเสร็จ/ยังไม่เสร็จ
            li.onclick = function() {
                li.classList.toggle('completed');
            };

            // ดับเบิลคลิกเพื่อลบงาน
            li.ondblclick = function() {
                li.remove();
            };

            document.getElementById('taskList').appendChild(li);
            input.value = '';
        }
    </script>

</body>
</html>
