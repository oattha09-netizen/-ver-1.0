<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - ระบบจัดการและแจ้งเตือนส่งงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container { width: 100%; max-width: 500px; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        h2 { color: #2d3748; font-weight: 600; margin-bottom: 20px; text-align: center; font-size: 24px; }
        
        .clock-box { background: #1a202c; color: #00ffcc; padding: 12px; text-align: center; font-size: 16px; font-weight: 500; border-radius: 8px; margin-bottom: 20px; letter-spacing: 1px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .input-group label { font-size: 13px; font-weight: 500; color: #4a5568; }
        
        input { padding: 12px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 8px; font-family: 'Prompt', sans-serif; transition: all 0.3s ease; }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
        
        button.add-btn { background: #667eea; color: white; border: none; padding: 12px; font-size: 15px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: background 0.3s ease, transform 0.1s; font-family: 'Prompt', sans-serif; }
        button.add-btn:hover { background: #5a67d8; }
        button.add-btn:active { transform: scale(0.98); }
        
        ul { list-style: none; display: flex; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        
        li { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 14px 16px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #edf2f7; border-left: 5px solid #667eea; transition: transform 0.2s; }
        li:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
        
        .task-info { display: flex; flex-direction: column; gap: 4px; width: 80%; cursor: pointer; }
        .task-name { font-weight: 600; font-size: 15px; color: #2d3748; }
        .time-tag { font-size: 12px; color: #e53e3e; font-weight: 500; }
        .countdown-tag { font-size: 11px; color: #3182ce; font-weight: 500; }
        .email-tag { font-size: 11px; color: #718096; }
        
        .completed { background: #f7fafc; border-left-color: #cbd5e0; }
        .completed .task-name, .completed .time-tag, .completed .countdown-tag, .completed .email-tag { color: #a0aec0; text-decoration: line-through; }
        
        .delete-btn { background: #fed7d7; color: #c53030; border: none; padding: 8px 12px; font-size: 12px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-family: 'Prompt', sans-serif; height: fit-content; }
        .delete-btn:hover { background: #feb2b2; }

        /* ตกแต่ง Scrollbar ให้ดูสวยงาม */
        ul::-webkit-scrollbar { width: 6px; }
        ul::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ TaskFlow แจ้งเตือนส่งงาน</h2>
        
        <div class="clock-box" id="liveClock">🕒 กำลังโหลดเวลาไทย...</div>

        <div class="input-group">
            <div>
                <label for="taskInput">ชื่องาน:</label>
                <input type="text" id="taskInput" placeholder="เช่น การบ้านคณิตศาสตร์ บทที่ 3">
            </div>
            <div>
                <label for="timeInput">กำหนดเวลา (24 ชั่วโมง):</label>
                <input type="time" id="timeInput">
            </div>
            <div>
                <label for="emailInput">อีเมลผู้รับแจ้งเตือน (ไม่บังคับ):</label>
                <input type="email" id="emailInput" placeholder="your-email@example.com">
            </div>
            <button class="add-btn" onclick="addTask()">+ เพิ่มงานและตั้งเตือน</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        // เสียงแจ้งเตือน
        function playAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio blocked");
            }
        }

        // นาฬิกาเรียลไทม์เวลาไทย
        setInterval(function() {
            const now = new Date();
            const options = { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const timeString = new Intl.DateTimeFormat('th-TH', options).format(now);
            document.getElementById('liveClock').textContent = `🕒 เวลาไทยปัจจุบัน: ${timeString}`;
        }, 1000);

        function addTask() {
            const input = document.getElementById('taskInput');
            const timeInput = document.getElementById('timeInput');
            const emailInput = document.getElementById('emailInput');
            
            const taskText = input.value.trim();
            const taskTime = timeInput.value;
            const taskEmail = emailInput.value.trim();

            if (taskText === '' || taskTime === '') {
                alert('กรุณากรอกชื่องานและเวลาให้ครบถ้วนครับ!');
                return;
            }

            const now = new Date();
            const [targetHour, targetMinute] = taskTime.split(':').map(Number);
            
            const targetDate = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
            targetDate.setHours(targetHour, targetMinute, 0, 0);

            if (targetDate <= now) {
                targetDate.setDate(targetDate.getDate() + 1);
            }

            const li = document.createElement('li');
            
            const infoDiv = document.createElement('div');
            infoDiv.className = 'task-info';
            infoDiv.innerHTML = `
                <span class="task-name">${taskText}</span> 
                <span class="time-tag">⏰ กำหนดส่ง: ${taskTime} น.</span>
                <span class="countdown-tag" id="cd-${Date.now()}">⏳ กำลังคำนวณเวลา...</span>
                ${taskEmail ? `<span class="email-tag">📧 แจ้งเตือน: ${taskEmail}</span>` : ''}
            `;
            
            infoDiv.onclick = function() {
                li.classList.toggle('completed');
            };

            const delBtn = document.createElement('button');
            delBtn.textContent = 'ลบ';
            delBtn.className = 'delete-btn';
            delBtn.onclick = function() {
                li.remove();
            };

            li.appendChild(infoDiv);
            li.appendChild(delBtn);
            
            li.setAttribute('data-target-time', targetDate.getTime());
            li.setAttribute('data-time-str', taskTime);
            li.setAttribute('data-task-name', taskText);
            li.setAttribute('data-email', taskEmail);
            li.setAttribute('data-notified', 'false');

            document.getElementById('taskList').appendChild(li);

            // เคลียร์ฟอร์ม
            input.value = '';
            timeInput.value = '';
            emailInput.value = '';
        }

        // ระบบจับเวลาถอยหลัง
        setInterval(function() {
            const now = new Date().getTime();
            const tasks = document.querySelectorAll('#taskList li');

            tasks.forEach(li => {
                const targetTime = parseInt(li.getAttribute('data-target-time'));
                const taskTimeStr = li.getAttribute('data-time-str');
                const taskName = li.getAttribute('data-task-name');
                const taskEmail = li.getAttribute('data-email');
                const isNotified = li.getAttribute('data-notified');
                
                const countdownTag = li.querySelector('.countdown-tag');
                const diff = targetTime - now;

                if (diff > 0) {
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    countdownTag.textContent = `⏳ เหลือเวลา: ${hours} ชม. ${minutes} นาที ${seconds} วินาที`;
                } else {
                    countdownTag.textContent = `⚠️ ถึงกำหนดเวลาแล้ว!`;
                    countdownTag.style.color = '#e53e3e';

                    if (isNotified === 'false') {
                        playAlarmSound();
                        
                        let alertMsg = `🚨 ถึงเวลาส่งงานแล้ว!\nงาน: ${taskName}\nกำหนดการ: ${taskTimeStr} น.`;
                        if (taskEmail) {
                            alertMsg += `\n(ระบบจำลอง: ส่งอีเมลแจ้งเตือนไปยัง ${taskEmail} เรียบร้อย)`;
                        }
                        alert(alertMsg);

                        li.setAttribute('data-notified', 'true');
                    }
                }
            });
        }, 1000);
    </script>

</body>
</html>
